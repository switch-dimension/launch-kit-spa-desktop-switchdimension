# Local PostgreSQL for development: `docker compose up -d`
# Matches the default DATABASE_URL in .env.example.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: launchkit
      POSTGRES_PASSWORD: launchkit
      POSTGRES_DB: launchkit
    ports:
      # Bound to localhost only; 5433 avoids clashing with an existing local Postgres.
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchkit -d launchkit"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  db-data:
